version: '3.8'

services:
  db:
    image: postgres:15
    container_name: karoka_postgres_dev
    environment:
      POSTGRES_USER: karoka
      POSTGRES_PASSWORD: karoka
      POSTGRES_DB: karoka_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    env_file:
    - ./backend/.env

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    depends_on:
      - db
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://karoka:karoka@db:5432/karoka_dev
      - FLASK_ENV=development
      - PORT=5001
    ports:
      - "5001:5001"
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - ./backend/karoka-core-firebase-adminsdk.json:/app/backend/karoka-core-firebase-adminsdk.json

  frontend:
    build:
      context: . # Build from the project root
      dockerfile: infra/docker/frontend.Dockerfile # Point to the correct Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:3000"
    env_file:
    - ./apps/frontend/.env

    # --- THIS IS THE FIX ---
    # 1. Set the working directory to where your React app lives
    working_dir: /app/apps/frontend
    # 2. Mount the ENTIRE project into the container's /app directory
    volumes:
      - .:/app
    # 3. Prevent the local node_modules from overwriting the container's node_modules
      - /app/apps/frontend/node_modules
    # --- END FIX ---

    command: npm run dev

volumes:
  postgres_dev_data:
