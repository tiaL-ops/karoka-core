version: '3.8'

services:
  db:
    image: postgres:15
    container_name: karoka_postgres_dev
    environment:
      POSTGRES_USER: karoka
      POSTGRES_PASSWORD: karoka
      POSTGRES_DB: karoka_dev
    ports:
      - "5433:5432"  # dev port
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

volumes:
  postgres_dev_data:
