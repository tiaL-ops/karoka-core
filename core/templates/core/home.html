<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-r from-gray-900 via-gray-800 to-black text-white flex flex-col justify-center items-center py-16 px-6">
    <div class="text-center max-w-2xl">
        <h1 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-500 mb-8">
            Welcome to the Algorithm Riddle Platform!
        </h1>

        {% if user.is_authenticated %}
            <p class="text-lg text-gray-300 mb-4">Hello, <span class="text-indigo-400">{{ user.username }}</span>!</p>

            <!-- Welcome Page Button -->
            <a href="{% url 'welcome' %}" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg shadow-md transition inline-block">
                Go to Welcome Page
            </a>

            <!-- Logout Button -->
            <form method="POST" action="{% url 'logout' %}" class="inline-block ml-4">
                {% csrf_token %}
                <button type="submit" class="px-6 py-3 bg-red-600 hover:bg-red-500 text-white font-semibold rounded-lg shadow-lg transition">
                    Logout
                </button>
            </form>
        {% else %}
            <div class="flex space-x-4 justify-center">
                <a href="{% url 'login' %}" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg shadow-lg transition">
                    Login
                </a>
                <a href="{% url 'account_signup' %}" class="px-6 py-3 bg-purple-600 hover:bg-purple-500 text-white font-semibold rounded-lg shadow-lg transition">
                    Sign Up
                </a>
            </div>
        {% endif %}
    </div>
</body>
</html>
