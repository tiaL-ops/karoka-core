<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{ puzzle.title }}</title>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor/min/vs/loader.js"></script>
    <style>
        #editor-container {
            height: 400px;
            border: 1px solid #ccc;
        }
        #feedback {
            font-weight: bold;
            margin-top: 10px;
        }
        #feedback.success {
            color: green;
        }
        #feedback.error {
            color: red;
        }
    </style>
</head>
<body>
    <h1>{{ puzzle.title }}</h1>
    <p>{{ puzzle.description }}</p>
    <p><strong>Hint:</strong> {{ puzzle.hint }}</p>

    <!-- Code Editor Section -->
    <h3>Practice Your Code</h3>
    <div id="editor-container"></div>
    <button id="run-code">Run Code</button>
    <pre id="output"></pre>

    <!-- Manual Submission Section -->
    <h3>Submit Your Solution</h3>
    <form id="solution-form">
        <label for="user-solution">Enter Your Final Answer:</label>
        <input type="text" id="user-solution" name="user_solution" placeholder="Your solution" required>
        <button type="submit">Submit</button>
    </form>

    <p id="feedback"></p>

    <script>
        // Set up the Monaco editor
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.34.1/min/vs' } });
        require(['vs/editor/editor.main'], function () {
            window.editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: '# Write your code here\n',
                language: 'python',
                theme: 'vs-light',
            });
        });

        // Run Code Button
        document.getElementById('run-code').addEventListener('click', function () {
            const code = editor.getValue();
            const language = 'python';

            fetch('/core/execute-code/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token|safe }}',
                },
                body: JSON.stringify({ code, language }),
            })
            .then(response => response.json())
            .then(data => {
                console.log("Run Code Response:", data);
                const output = data.output || data.error;
                document.getElementById('output').textContent = output;
            });
        });

        // Submit Solution Form
        document.getElementById('solution-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const userSolution = document.getElementById('user-solution').value;
            const puzzleId = "{{ puzzle.id }}";

            fetch('/core/submit-answer/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token|safe }}',
                },
                body: JSON.stringify({ puzzle_id: puzzleId, user_solution: userSolution }),
            })
            .then(response => response.json())
            .then(data => {
                console.log("Submit Answer Response:", data);
                const feedback = document.getElementById('feedback');
                if (data.is_correct) {
                    feedback.textContent = "🎉 Correct! Well done!";
                    feedback.className = "success";
                } else {
                    feedback.textContent = "❌ Incorrect. Try again!";
                    feedback.className = "error";
                }
            });
        });
    </script>
</body>
</html>
