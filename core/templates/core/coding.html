<!DOCTYPE html>
<html lang="en">
<head>
    <title>Code Runner</title>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor/min/vs/loader.js"></script>
    <style>
        #editor-container {
            height: 400px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h1>Online Code Runner</h1>
    <div id="editor-container"></div>
    <button id="run-code">Run Code</button>
    <pre id="output"></pre>

    <script>
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.34.1/min/vs' } });
        require(['vs/editor/editor.main'], function () {
            window.editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: '// Write your code here\n',
                language: 'python', // Default language
                theme: 'vs-light',
            });
        });

        document.getElementById('run-code').addEventListener('click', function () {
    const code = editor.getValue();
    const language = 'python'; // Hardcoded for now

    console.log('Sending code to execute:', code); // Log the code being sent

    fetch('/execute-code/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}',
        },
        body: JSON.stringify({ code, language }),
    })
    .then(response => response.json())
    .then(data => {
        console.log('Response data:', data); // Log the full response
        document.getElementById('output').textContent = data.output || data.error;
    })
    .catch(error => {
        console.error('Error during fetch:', error);
        document.getElementById('output').textContent = 'An error occurred.';
    });
});

    </script>
</body>
</html>
