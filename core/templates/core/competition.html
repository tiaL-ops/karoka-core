<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ competition.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-b from-gray-900 via-gray-800 to-black text-white">
    <!-- Header -->
    <header class="bg-gray-800/70 p-8 shadow-lg">
        <div class="container mx-auto text-center">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-500">
                {{ competition.name }}
            </h1>
            <p class="text-lg text-gray-300 mt-4">{{ competition.description }}</p>
            <a href="{% url 'welcome' %}" class="inline-block mt-6 px-6 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg shadow-md transition">
                🏠 Back to Home
            </a>
            <a href="{% url 'leaderboard' %}" class="px-6 py-3 bg-purple-600 hover:bg-purple-500 text-white font-semibold rounded-lg shadow-lg transition">
                🏆 View Leaderboard
            </a>
        </div>
    </header>

    <!-- Story Section -->
    <section class="container mx-auto my-12 px-6">
        <div class="bg-gray-800/60 p-6 rounded-lg shadow-lg">
            <h2 class="text-2xl font-bold text-indigo-400 mb-4">The Story</h2>
            <p class="text-gray-300">{{ competition.story }}</p>
        </div>
    </section>

    <!-- Challenges Section -->
    <section class="container mx-auto my-12 px-6">
        <div class="bg-gray-800/60 p-6 rounded-lg shadow-lg">
            <h3 class="text-2xl font-bold text-purple-400 mb-4">All Challenges</h3>
            <ul class="space-y-4">
                {% for puzzle in puzzles %}
                    <li class="flex items-center justify-between bg-gray-900/80 p-4 rounded-lg shadow-md">
                        <a href="{% url 'coding_view' puzzle.id %}" class="text-lg font-semibold text-indigo-400 hover:underline">
                            {{ puzzle.title }}
                        </a>
                        {% if puzzle.id in solved_puzzles_ids %}
                            <span class="text-green-500 font-semibold">Solved</span>
                        {% else %}
                            <span class="text-red-500 font-semibold">Unsolved</span>
                        {% endif %}
                    </li>
                {% endfor %}
            </ul>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-800/70 py-6 mt-12 text-center">
       
    </footer>
</body>
</html>
