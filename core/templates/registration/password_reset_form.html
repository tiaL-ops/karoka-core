<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/core_style.css' %}">
</head>
<body class="min-h-screen bg-gradient-to-b from-blue-100 via-purple-100 to-pink-100 flex items-center justify-center">
    <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-8">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Reset Your Password</h2>

        <!-- Password Reset Form -->
        <form method="post" class="space-y-6 w-full">
            {% csrf_token %}

            <div class="space-y-1">
                <label for="email" class="block text-sm font-medium text-gray-700">
                    Enter your email address
                </label>
                <div class="flex items-center border rounded-lg px-3 py-2 shadow-sm bg-gray-50 focus-within:ring-2 focus-within:ring-purple-500">
                    <span class="material-icons text-gray-500">email</span>
                    {{ form.email }}
                </div>
                {% if form.email.errors %}
                    <p class="text-red-500 text-sm mt-1">{{ form.email.errors|join:", " }}</p>
                {% endif %}
            </div>

            <button type="submit" class="w-full py-2 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white font-semibold rounded-lg shadow-md transition hover:opacity-90">
                Send Password Reset Email
            </button>
        </form>

        <!-- Back to Login -->
        <div class="mt-4 text-center">
            <a href="{% url 'account_login' %}" class="text-sm text-purple-500 hover:underline">
                Back to Login
            </a>
        </div>
    </div>

    <!-- Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</body>
</html>
