<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-b from-gray-900 via-gray-800 to-black text-white flex items-center justify-center">
    <div class="w-full max-w-md bg-gray-800/70 p-8 rounded-lg shadow-lg">
        <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-500 text-center mb-6">
            Login
        </h2>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div class="space-y-2">
                {{ form.as_p }}
            </div>
            <button type="submit" class="w-full px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg shadow-md transition">
                Login
            </button>
        </form>
        <p class="mt-4 text-center text-gray-400">
            Don’t have an account? 
            <a href="{% url 'account_signup' %}" class="text-indigo-400 hover:underline">
                Sign up here
            </a>.
        </p>
        <p class="mt-2 text-center text-gray-400">
            Forgot your password? 
            <a href="{% url 'password_reset' %}" class="text-indigo-400 hover:underline">
                Reset it here
            </a>.
        </p>
    </div>
</body>
</html>
