<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Sent</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/core_style.css' %}">
</head>
<body class="min-h-screen bg-gradient-to-b from-blue-100 via-purple-100 to-pink-100 flex items-center justify-center">
    <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-8">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Check Your Email</h2>
        <p class="text-gray-700 text-center">
            We’ve sent you an email with instructions to reset your password.
        </p>
        <div class="mt-6 text-center">
            <a href="{% url 'account_login' %}" class="text-sm text-purple-500 hover:underline">
                Back to Login
            </a>
        </div>
    </div>
</body>
</html>
