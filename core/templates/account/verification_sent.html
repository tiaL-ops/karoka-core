<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Confirmation Sent</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/core_style.css' %}">
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">Check Your Email</h1>
        <p class="text-gray-600">
            A confirmation email has been sent to your email address. Please check your inbox and click the confirmation link to complete your registration.
        </p>
        <p class="text-gray-600 mt-4">
            Didn’t receive the email? 
            <a href="{% url 'account_email' %}" class="text-blue-500 font-semibold">Update your email address</a>.
        </p>
        <div class="mt-6 text-center">
            <a href="{% url 'home' %}" class="text-purple-500 hover:underline">Back to Home</a>
        </div>
    </div>
</body>
</html>
