<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Your Email</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/core_style.css' %}">
</head>
<body class="min-h-screen bg-gradient-to-b from-blue-100 via-purple-100 to-pink-100 flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-4 text-center">Confirm Your Email</h1>
        <p class="text-gray-600 text-center mb-4">
            Hi {{ user.email }}, please click the button below to confirm your email address and complete your registration.
        </p>
        <form method="post" class="text-center">
            {% csrf_token %}
            <button type="submit" class="w-full py-2 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white font-semibold rounded-lg shadow-md transition hover:opacity-90">
                Confirm Email
            </button>
        </form>
        <div class="mt-6 text-center">
            <a href="{% url 'home' %}" class="text-purple-500 hover:underline">Back to Home</a>
        </div>
    </div>
</body>
</html>
