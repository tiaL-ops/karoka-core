<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-b from-blue-100 via-purple-100 to-pink-100 flex items-center justify-center">
    <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-8">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Login</h2>

        <!-- Login Form -->
        <form method="post" class="space-y-6 w-full">
            {% csrf_token %}
            <!-- Custom Render for Each Field -->
            {% for field in form %}
                <div class="space-y-1">
                    <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700">
                        {{ field.label }}
                    </label>
                    <div class="flex items-center border rounded-lg px-3 py-2 shadow-sm bg-gray-50 focus-within:ring-2 focus-within:ring-purple-500">
                        <!-- Use Icons for Username and Password -->
                        {% if field.name == "username" %}
                            <span class="material-icons text-gray-500">person</span>
                        {% elif field.name == "password" %}
                            <span class="material-icons text-gray-500">lock</span>
                        {% endif %}
                        {{ field }}
                    </div>
                    <!-- Display Errors -->
                    {% if field.errors %}
                        <p class="text-red-500 text-sm mt-1">{{ field.errors|join:", " }}</p>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="w-full py-2 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white font-semibold rounded-lg shadow-md transition hover:opacity-90">
                Login
            </button>
        </form>

        <!-- Forgot Password -->
        <div class="mt-4 text-center">
            <a href="{% url 'account_reset_password' %}" class="text-sm text-purple-500 hover:underline">
                Forgot your password?
            </a>
        </div>

        <!-- Sign-Up Link -->
        <div class="mt-6 text-center text-sm text-gray-500">
            Don’t have an account? 
            <a href="{% url 'account_signup' %}" class="text-purple-500 hover:underline font-semibold">Sign Up</a>
        </div>
    </div>

    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</body>
</html>
